<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#172b4d">
  <meta name="description" content="離線油壓缸設備、備品與維修管理">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <title>油壓缸管理系統</title>
</head>
<body>
  <header class="topbar">
    <div><div class="eyebrow">CYLINDER MANAGEMENT</div><h1>油壓缸管理系統</h1></div>
    <div class="top-actions"><span id="storageStatus" class="storage-status">本機資料</span><button id="undoTop" class="button button-light" disabled>復原上一動</button><button id="backupTop" class="button button-light">備份資料</button><button id="updateTop" class="button button-light">更新至最新</button></div>
  </header>
  <nav class="nav" aria-label="主選單">
    <button data-page="overview" class="nav-button active">設備總覽</button>
    <button data-page="online" class="nav-button">線上設備</button>
    <button data-page="spares" class="nav-button">備品管理</button>
    <button data-page="database" class="nav-button">油壓缸資料庫</button>
    
    <button data-page="usageHistory" class="nav-button">歷年使用資料</button>
    <button data-page="history" class="nav-button">異動與維修</button>
    <button data-page="settings" class="nav-button">資料備份</button>
    <button data-page="scrapped" class="nav-button">報廢油壓缸</button>
  </nav>
  <main id="app" class="main" aria-live="polite"><div class="loading">正在載入本機資料…</div></main>
  <dialog id="modal"><form method="dialog" id="modalForm"><div class="modal-head"><h2 id="modalTitle">資料操作</h2><button class="icon-button" value="cancel" aria-label="關閉">✕</button></div><div id="modalBody" class="modal-body"></div><div class="modal-actions"><button class="button button-light" value="cancel">取消</button><button id="modalSubmit" class="button button-primary" value="default">確認</button></div></form></dialog>
  <input id="importFile" type="file" accept="application/json,.json" hidden>
  <script src="./db.js"></script>
  <script src="./app.js"></script>
</body>
</html>
